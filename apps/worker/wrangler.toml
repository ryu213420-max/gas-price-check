name = "gas-price-check"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 価格は毎日変わるため、定期的に取り直す (06:15 JST = 21:15 UTC)
[triggers]
crons = ["15 21 * * *"]

# ↓ database_id は `wrangler d1 create gas-price-check` で発行されたものに差し替える
[[d1_databases]]
binding = "DB"
database_name = "gas-price-check"
database_id = "ded200b4-b5dd-46b4-9ef4-726236c07b82"

# ↓ id は `wrangler kv namespace create CACHE` で発行されたものに差し替える
[[kv_namespaces]]
binding = "CACHE"
id = "104c1364b7224e1c9b7c221f59eee5c4"

[ai]
binding = "AI"

# シークレットは wrangler secret put で設定する（このファイルには書かない）:
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / SESSION_SECRET
